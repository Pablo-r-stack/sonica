<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador</title>
    <!-- Icon for the browser tab -->
    <link rel="icon" href="img/logo/wepik-export-202404182339020TpB.png" type="image/png">
    <!-- Image for sharing the link -->
    <meta property="og:image" content="https://pablo-r-stack.github.io/sonica/img/previsualizacion.png">
    <!-- CSS Styles -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .section-admin {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .section-admin .admin-buttons {
            display: flex;
            gap: 20px;
        }

        .section-admin button {
            white-space: nowrap;
            max-width: 200px;
            height: 50px;
            font-size: 1.5rem;
            background-color: #0F1640;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .section-admin button:hover {
            background-color: #2055b1;
        }

        .lista-usuarios h2 {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        .lista-usuarios,
        .lista-eventos {
            display: none;
            padding: 20px;
            background-color: #1f1d1d;
        }

        .user-list {
            display: flex;
            margin-bottom: 1rem;
            list-style-type: none;
            padding: 1rem;
            border: 1px solid white;
            align-items: center;
            justify-content: space-between;
        }

        .user-list li {
            display: inline-block;
            margin-right: 1rem;
            font-size: 1.5rem;
        }

        .user-list li strong {
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .user-list .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;

        }

        .user-list .action-buttons button {

            width: 100px;
            margin-left: 1rem;
            font-size: 1.5rem;
            margin: auto 0.5rem;
            background-color: #0F1640;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .user-list .action-buttons button:hover {
            background-color: #0F1640;
        }

        .rolSelect {
            background-color: #484444;
        }

        .texto {
            padding: 1rem;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 2rem;
            flex-wrap: nowrap;
        }

        .event-item span {
            flex: 1;
            font-size: 1.5rem;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .event-item button {
            width: 200px;
            margin-left: 1rem;
            font-size: 1.5rem;
        }

        .lista-eventos h1 {
            font-size: 2.5rem;
            text-align: center;
        }

        @media (min-width: 768px) {
            .user-list .action-buttons {
                display: flex;
                flex-direction: row;

            }

        }

        @media (min-width: 1024px) {
            .lista-usuarios h2 {
                text-align: center;
                margin-bottom: 1rem;
                font-size: 3rem;
            }

            .user-list .action-buttons button {
                width: 120px;
            }
        }
    </style>
</head>

<body>

    <!-- Checkbox for mobile menu -->
    <input type="checkbox" id="toggler">
    <!-- End checkbox for mobile menu -->

    <header>
        <nav>
            <div class="logo">
                <a href="/">
                    <img src="img/logo/wepik-export-202404182339020TpB.png" alt="logo">
                    <p>Sonica</p>
                </a>
            </div>
            <!-- Mobile Menu -->
            <label for="toggler">
                <div></div>
                <div></div>
                <div></div>
            </label>
            <!-- End Mobile Menu -->
            <ul class="navLinks">
                <li><a href="/acercade.html">Acerca de</a></li>
                <li><a href="/soporte.html">Soporte</a></li>
                <li><a href="/registrar.html">Registrar</a></li>
                <li><a href="/login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <!-- BANNER -->
    <div class="shadow-banner">
        <img class="banner" src="img/banner/banner2.jpg" alt="banner">
        <h1 class="parrafo-banner">Administrador</h1>
    </div>

    <main>
        <section class="section-admin">
            <div class="admin-buttons">
                <button class="btn-contacto" data-usuarioBtn>Lista de Usuarios</button>
                <button class="btn-contacto" data-eventosBtn>Lista de Eventos</button>
            </div>
        </section>

        <section class="lista-usuarios">
            <h2>Lista de Usuarios</h2>
        </section>

        <section class="lista-eventos">
            <h1>Modificar Evento</h1>
            <div class="event-list">
                <ul>
                </ul>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>2024- Todos los derechos reservados</p>
        <ul>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="acercade.html">Acerca de</a></li>
            <li><a href="soporte.html">Soporte</a></li>
        </ul>
    </footer>
